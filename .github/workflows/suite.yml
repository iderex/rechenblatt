# The gates a change to the code is judged by: formatting, lint, the proof that
# both of those bite, and the build, the suite and the coverage floor.
#
# One workflow rather than several, so a reader who wants to know what runs on a
# pull request opens one file. The guards that read the tracked tree rather than
# the code stay in their own workflows beside this one; docs/checks.md is where
# that division is argued and where the command that prints the whole set is.
#
# THE JOB NAMES ARE THE CONTRACT. A branch protection rule matches a check by its
# literal name, and a job with no `name:` produces a check named after its id, so
# adding, removing or editing one of those lines renames the check and detaches
# any rule that required it without anything going red. Every job below names
# itself explicitly for that reason, and docs/checks.md carries the names beside
# the commands that reproduce them.
#
# Every gate here runs the same command a contributor runs, with the rules in
# tracked files rather than on the command line, so a run here and a run on a
# laptop cannot be given different rules. `--locked` is on every cargo command
# that takes it: a run that would rewrite Cargo.lock fails instead of rewriting
# it.
#
# There is no path filter anywhere in this file, and that is deliberate rather
# than an omission. A job skipped by a path filter reports nothing at all, and a
# required check reads nothing as never satisfied, so the pull request waits on a
# gate that decided it had nothing to do.
#
# The file keeps the path it had when it held the build alone. docs/test-harness.md
# names that path, and moving it would buy a tidier name at the cost of a document
# pointing at nothing.
name: gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only at the workflow level. No job here needs more, and the job that
# someday does is where the widening goes rather than this line.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Show the formatter this commit pins
        # rustup reads rust-toolchain.toml, which names rustfmt as a component, so
        # this step installs it and puts its version in the log where a reader of a
        # failed run can see which formatter produced the failure.
        run: |
          set -euo pipefail
          cat rust-toolchain.toml
          cargo fmt --version

      - name: Check the formatting without writing
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the linter this commit pins
        run: |
          set -euo pipefail
          cat rust-toolchain.toml
          cargo clippy --version

      - name: Lint every target
        # No -D on this line. The denial is in Cargo.toml, so this command means
        # the same thing here and on a contributor's machine. --all-targets
        # reaches the tests as well as the libraries.
        run: cargo clippy --locked --workspace --all-targets

  proof:
    name: Prove the format and lint gates bite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plant each mistake and require the gate to refuse it
        # Nine legs. Every refusal against a tree holding exactly the mistake it
        # is about, the same tree with that one thing changed back, and - for the
        # lint gate - the mistake again with the denial taken out of Cargo.toml,
        # which is what says the tracked line is doing the refusing.
        run: bash .github/scripts/prove-format-and-lint.sh

  names:
    name: Names match the document
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove each refusal bites
        # First, for the same reason the tracked-bytes proof runs before its
        # scan: a checker that has stopped biting reports a clean tree, and a
        # clean report from a dead check is worse than a red one.
        run: bash .github/scripts/prove-check-names.sh

      - name: Refuse a check name only one side knows about
        run: bash .github/scripts/check-check-names.sh .

  suite:
    name: Build and suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned. An unpinned build tool is a dependency that changes without a
      # commit saying so.
      LLVM_COV_VERSION: "0.8.7"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Show the toolchain this commit pins
        # rustup reads rust-toolchain.toml and fetches the pinned compiler, so
        # this step both installs it and puts the version in the log where a
        # reader of a failed run can see which compiler produced the failure.
        run: |
          set -euo pipefail
          cat rust-toolchain.toml
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Run the suite
        run: cargo test --locked --workspace

      - name: Install the coverage tool
        # Compiled on the runner from a pinned version rather than brought in as a
        # third-party action, which keeps this gate first-party in the same way
        # the sign-off gate is.
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"

      - name: Measure coverage against the declared floor
        # The floor is read out of docs/test-harness.md rather than written here,
        # so the number and the reasoning for it cannot drift apart. A run that
        # cannot read it fails rather than assuming one.
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^Coverage floor: \([0-9][0-9]*\)$/\1/p' docs/test-harness.md)
          if [ -z "$floor" ]; then
            echo "::error::docs/test-harness.md declares no coverage floor this gate can read."
            echo "::error::Expected a line reading 'Coverage floor: <number>' at column zero."
            exit 1
          fi
          if [ "$(printf '%s\n' "$floor" | wc -l)" -ne 1 ]; then
            echo "::error::docs/test-harness.md declares more than one coverage floor."
            exit 1
          fi
          echo "floor read from docs/test-harness.md: ${floor}%"
          cargo llvm-cov --locked --workspace --summary-only --fail-under-lines "$floor"

  impure:
    name: Declare what needs an environment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove each refusal bites
        # First, for the same reason the other checkers here are preceded by
        # their proofs: a checker that has stopped biting reports a clean
        # register, and a clean report from a dead check is worse than a red one.
        run: bash .github/scripts/prove-needs-an-environment.sh

      - name: Refuse an entry that names no need, no reason or no script
        run: bash .github/scripts/check-needs-an-environment.sh .

      - name: Print what is outside the default suite, and run none of it
        # The list, on every pull request, so the set of things that cannot be
        # pure is visible in a run rather than only in a file somebody opens.
        # Naming no entry is what makes this print rather than run.
        run: bash .github/scripts/needs-an-environment.sh list

  excluded:
    name: What the default run excludes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove each refusal bites
        # First, for the same reason the other checkers here are preceded by
        # their proofs: a checker that has stopped biting reports a set that
        # agrees with the tree, and a clean report from a dead check is worse
        # than a red one.
        run: bash .github/scripts/prove-excluded-from-the-default-run.sh

      - name: Print what the default run excludes, and refuse a test that runs nowhere
        # One step rather than two. The checker prints every excluded test with
        # the source it is in and the entry that runs it before it judges, so the
        # set is visible in a run rather than only in a file somebody opens, and
        # the print cannot drift from the verdict because it is the same read.
        run: bash .github/scripts/check-excluded-from-the-default-run.sh .

  headless:
    name: Headless and unelevated
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The default suite, with none of it available
        # The suite again, this time in a container with no network route, no
        # writable filesystem outside the workspace and one tmpfs, no display
        # server, no host font directory and no elevated rights. The job above
        # says the suite passes; this one says what it does not need in order to.
        #
        # Through the harness rather than straight at the script, so the route a
        # contributor is told to use is the route this gate proves. It also puts
        # the environment record in the log beside the result, which is what
        # stops a number from here being quoted as one from the default suite.
        run: bash .github/scripts/needs-an-environment.sh sealed-suite

      - name: The probes, every one of which must fail there
        # A sealed environment that is not actually sealed passes the same suite,
        # so the environment needs its own proof. Each probe asserts that one of
        # those things IS available, so every one of them has to fail there, and
        # each failure has to carry a cause rather than a timeout.
        run: bash .github/scripts/needs-an-environment.sh sealed-probes

name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This job named itself after its id until now, because a comment here said a
  # ruleset required the literal name `dependency-review` and that renaming it
  # would break the gate. No ruleset on this repository requires any check, which
  # is read rather than remembered:
  #
  #     gh api repos/iderex/rechenblatt/rulesets/20487256 \
  #       --jq '[.rules[] | select(.type == "required_status_checks")] | length'
  #     0
  #
  # So the name was free to fix and is now explicit, like every other job in the
  # tree. An implicit name is the one that moves on its own: it follows the job
  # id, and a job id is the kind of thing somebody tidies. docs/checks.md carries
  # this name and .github/scripts/check-check-names.sh refuses a job that has
  # none.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low

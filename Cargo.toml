# The workspace and the edges between its components, set while there is nothing
# in them, because which component may depend on which is an architectural claim
# that is cheap to make now and expensive to retrofit.
#
# The edges, in one direction only:
#
#   model     depends on nothing here. It is what a document says, read once.
#   calc      depends on model.
#   render    depends on model and calc.
#   macro     depends on model and calc, and not on render. The macro track reads
#             and changes a workbook; it does not become a second renderer.
#   host      depends on nothing here. It is the filesystem, the network and the
#             clock, and it is the only component allowed to hold them.
#   cli       depends on all five and is what an operator runs.
#
# A crate cannot use what it does not depend on, so this file is the enforcement
# and not a diagram of one. Issue #101 is where the rest of the architecture
# becomes tests.
#
# Each member declares which side of the input boundary it is on, in a
# `[package.metadata.rechenblatt]` table in its own manifest. A component on the
# parsing side may not depend on one that can reach a capability, and
# crates/cli/tests/boundary.rs refuses the edge by name.
# docs/decisions/0003-input-boundary.md is where that is argued.

[workspace]
resolver = "3"
members = [
  "crates/model",
  "crates/calc",
  "crates/render",
  "crates/macro",
  "crates/host",
  "crates/cli",
]

[workspace.metadata.rechenblatt]
# Crates from outside this workspace that a parsing component may depend on.
#
# It is empty, and empty is a decision rather than a placeholder: nothing outside
# this workspace has been read closely enough to say what it can reach. The check
# fails closed against it, so the first dependency a parser needs arrives with
# somebody having looked at it and written the name down here, in the commit that
# needs it. A component on the host side is not judged against this list.
pure-may-depend-on = []

[workspace.package]
version = "0.0.0"
edition = "2024"
# The minimum supported version is the pin in rust-toolchain.toml and there is no
# second number. Cargo refuses an older compiler here, at the start of the build,
# instead of letting it fail later inside a dependency with a message about
# syntax. docs/decisions/0001-means.md is where that policy is argued.
rust-version = "1.97.1"
repository = "https://github.com/iderex/rechenblatt"
# No `license` field. This repository has no licence yet; it is the first entry of
# issue #111 and it is delivered by issue #88. Naming one here would decide it by
# accident, so every package below also sets `publish = false`.

[workspace.dependencies]
rechenblatt-model = { path = "crates/model", version = "0.0.0" }
rechenblatt-calc = { path = "crates/calc", version = "0.0.0" }
rechenblatt-render = { path = "crates/render", version = "0.0.0" }
rechenblatt-macro = { path = "crates/macro", version = "0.0.0" }
rechenblatt-host = { path = "crates/host", version = "0.0.0" }

[workspace.lints.rust]
# The means record's policy, held by the compiler rather than by review. An
# exception is a narrower allow with its reason beside it in the source, which is
# visible in a diff; this denial is what makes that visible.
unsafe_code = "deny"
# A warning fails the build, and this one line is what does it for the compiler
# and for the linter both. `warnings` is every lint currently at warn level, and
# when cargo hands it to clippy that includes clippy's own, so a lint in
# `clippy::all` errors here without `clippy` being named. A second declaration
# saying `clippy::all = "deny"` beside this would change nothing a run can see,
# and .github/scripts/prove-format-and-lint.sh is where that was measured rather
# than assumed.
#
# It is declared here rather than passed as `-D warnings` on a command line, so a
# local run and a workflow run cannot disagree about it: whoever runs cargo gets
# this, whatever they typed.
#
# The priority leaves room for a narrower allow beside the code that needs it,
# which is the exception a reviewer can see in a diff. The compiler is pinned in
# rust-toolchain.toml, so a lint that is new rather than newly broken arrives in
# the commit that moves the pin and not on a morning nobody changed anything.
warnings = { level = "deny", priority = -1 }

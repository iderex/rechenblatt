[package]
name = "rechenblatt-calc"
description = "Calculation, as far as the page needs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The parsing side of the input boundary. This component reads bytes it did not
# create, so it may not depend on anything that can open a path, make a network
# call or read a clock. crates/cli/tests/boundary.rs refuses such a dependency
# and docs/decisions/0014-input-boundary.md argues why.
[package.metadata.rechenblatt]
side = "pure"

[dependencies]
rechenblatt-model.workspace = true

[lints]
workspace = true

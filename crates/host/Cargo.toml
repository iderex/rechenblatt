[package]
name = "rechenblatt-host"
description = "The filesystem, the network and the clock, in one place."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The host side of the input boundary. This is the component allowed to open a
# path, make a network call or read a clock, and it is the only one. Nothing that
# reads bytes a stranger wrote may depend on it, which
# crates/cli/tests/boundary.rs refuses and docs/decisions/0003-input-boundary.md
# argues.
[package.metadata.rechenblatt]
side = "host"

[lints]
workspace = true

[package]
name = "rechenblatt-model"
description = "The workbook model: what a document says, read once."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The parsing side of the input boundary. This component reads bytes it did not
# create, so it may not depend on anything that can open a path, make a network
# call or read a clock. crates/cli/tests/boundary.rs refuses such a dependency
# and docs/decisions/0014-input-boundary.md argues why.
[package.metadata.rechenblatt]
side = "pure"

# The one component that turns a document into the model. Everything else in the
# workspace reads the model rather than the file, and
# crates/cli/tests/model_ownership.rs refuses a second component declaring this
# and a part of a document named anywhere else.
# docs/decisions/0003-workbook-model.md argues why.
reads-documents = true

[lints]
workspace = true
